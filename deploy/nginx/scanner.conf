# Reverse proxy for the scanner app running in Docker on 127.0.0.1:8080.
# No domain yet, so this serves on the bare IP. Once you have a domain,
# swap server_name below and re-run certbot --nginx per the deploy notes.

server {
    listen 80;
    server_name 216.158.233.36;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
