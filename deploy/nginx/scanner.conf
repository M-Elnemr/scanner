# Serves two things on the same bare IP:
#   - the Next.js frontend (web/, its own Docker service on 127.0.0.1:3000) at /
#   - the Spring Boot API, running in Docker on 127.0.0.1:8080, under its own paths
#
# The split works cleanly because the API was already fully namespaced under /api/v1
# (plus a handful of framework paths below) before the web app existed — nothing here
# needed to change on the backend side to make room for it.
#
# server_name carries the bare IP, the free wildcard-DNS fallback (sslip.io resolves
# 216-158-233-36.sslip.io straight back to 216.158.233.36, no DNS setup needed), and the
# real domain (umrahscan.com, registered via GoDaddy, A record pointed at this IP). A real
# domain exists because Google OAuth flatly refuses a bare IP as an "Authorized JavaScript
# origin" ("Must end with a public top-level domain") — certbot then adds a matching HTTPS
# server block for whichever hostnames you pass it; see the deploy notes for the command.

server {
    listen 80;
    server_name 216.158.233.36 216-158-233-36.sslip.io umrahscan.com www.umrahscan.com;

    # --- Next.js frontend ---
    # Upgrade/Connection headers are for HMR websockets in dev; harmless to leave in for a
    # production `next start` server too.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Backend API ---
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded company logos etc, served back out by the app itself.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI + OpenAPI docs.
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
