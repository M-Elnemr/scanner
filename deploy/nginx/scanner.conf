# Serves two things on the same bare IP:
#   - the Flutter web build (static files) at /
#   - the Spring Boot API, running in Docker on 127.0.0.1:8080, under its own paths
#
# The split works cleanly because the API was already fully namespaced under /api/v1
# (plus a handful of framework paths below) before the web app existed — nothing here
# needed to change on the backend side to make room for it.
#
# server_name carries both the bare IP (still reachable directly) and a free wildcard-DNS
# domain (sslip.io resolves 216-158-233-36.sslip.io straight back to 216.158.233.36, no DNS
# setup needed). The domain exists because Google OAuth flatly refuses a bare IP as an
# "Authorized JavaScript origin" ("Must end with a public top-level domain") — certbot then
# adds a matching HTTPS server block for that hostname; see the deploy notes for the command.

server {
    listen 80;
    server_name 216.158.233.36 216-158-233-36.sslip.io;

    # --- Flutter web app ---
    # try_files falls back to index.html for any path Flutter's own router owns
    # client-side (e.g. a deep link) rather than 404ing at the nginx layer.
    root /var/www/scanner-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Backend API ---
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded company logos etc, served back out by the app itself.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI + OpenAPI docs.
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
