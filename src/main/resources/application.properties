spring.application.name=scanner

# --- Jackson ---
# Every request DTO in the app is a Java record, and several use a primitive boolean/short/int for
# an optional flag (e.g. TripHotelRequest.canWalk, ContactCompanyRequest.adultCount). Jackson's
# record support otherwise rejects the request outright — 400 "Cannot map `null` into type
# `boolean`" — the instant such a field is omitted from the JSON body, rather than falling back to
# the Java default (false/0) the way a hand-written setter-based bean would. This restores that
# fallback globally instead of requiring every optional primitive field to be boxed one by one.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:umrah_scanner}
spring.datasource.username=${DB_USERNAME:umrah_scanner}
spring.datasource.password=${DB_PASSWORD:umrah_scanner}

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only validates it matches these entities, never generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Auth / JWT ---
# app.jwt.secret must be a base64-encoded key of at least 256 bits (32 bytes) for HS256.
# Generate one with: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET:CHANGE_ME_dev_only_secret_CHANGE_ME_dev_only_secret}
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P30D

# --- Google Sign-In ---
# OAuth2 client id(s) issued to the mobile apps (customer + company); comma-separated, used as the JWT audience check.
app.google.client-ids=${GOOGLE_CLIENT_IDS:}

# --- Firebase Cloud Messaging ---
# Path to the Firebase service-account JSON (Firebase Console -> Project Settings ->
# Service Accounts -> Generate new private key). Left blank, push sending is a no-op
# (in-app notifications still work) so local dev never needs real credentials.
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# --- Public base URL ---
# Used to turn relative /uploads/... paths into absolute URLs for things that need one
# off-server (FCM notification images). Leave blank to send text-only push notifications.
app.base-url=${APP_BASE_URL:}

# --- CORS ---
# Comma-separated list of allowed origins for browser clients (e.g. the Flutter web app), or "*"
# for any origin. Safe to leave as "*" since auth uses a Bearer token, never cookies/credentials.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# --- Cashback ---
# Share of a lead's commission handed back to the customer (0.25 = commission / 4). Applies to leads
# created from now on; existing leads keep the amount they were priced with. This is only the default
# rule — a targeted promotion or coupon arrives as a higher-precedence CashbackPolicy bean, not as a
# change to this value.
app.cashback.default-share=0.25

# --- File uploads (company logos) ---
# Directory the app writes/serves uploaded files from; must be a persistent volume in Docker.
app.uploads.dir=${UPLOADS_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Dev-only Google login bypass ---
# Must stay false everywhere except application-dev.properties. Even when true, the
# /api/v1/auth/dev-google-test endpoint only exists at all under the "dev" Spring profile
# (see DevAuthController) — this flag is the second, independent guard, not the only one.
app.dev-auth.enabled=false
