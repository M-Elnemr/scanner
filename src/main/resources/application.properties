spring.application.name=scanner

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:umrah_scanner}
spring.datasource.username=${DB_USERNAME:umrah_scanner}
spring.datasource.password=${DB_PASSWORD:umrah_scanner}

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
