services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-umrah_scanner}
      POSTGRES_USER: ${DB_USERNAME:-umrah_scanner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-umrah_scanner} -d ${DB_NAME:-umrah_scanner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-umrah_scanner}
      DB_USERNAME: ${DB_USERNAME:-umrah_scanner}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      UPLOADS_DIR: /app/uploads
    volumes:
      - app_uploads:/app/uploads
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  db_data:
  app_uploads:
